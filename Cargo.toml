[package]
name = "aero-dataset-provenance"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Offline aviation dataset hashing, split leakage detection, ODD observations, and detached report attestation"
license = "MIT"
repository = "https://github.com/mizcausevic-dev/aero-dataset-provenance-rs"

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
hash-attestation = { version = "=0.2.1", git = "https://github.com/mizcausevic-dev/hash-attestation-rs", rev = "ba720e06e1f6b37e6d603a74fef6623a0d1b3c56" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
url = "=2.5.8"
